name: Mein erster Workflow

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  erkunden:
    runs-on: ubuntu-latest

    steps:
      - name: Begruessung
        run: echo "Hallo von GitHub Actions!"

      - name: Runner untersuchen
        run: |
          echo "Betriebssystem: $RUNNER_OS"
          echo "Repository: $GITHUB_REPOSITORY"
          pwd
          ls -la

      - name: Repository herunterladen
        uses: actions/checkout@v7

      - name: Repository-Inhalt untersuchen
        run: |
          echo "Aktuelles Verzeichnis:"
          pwd
          echo "Dateien im Verzeichnis:"
          ls -la
          echo "Inhalt der README:"
          cat README.md
