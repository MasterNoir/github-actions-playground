name: Mein erster Workflow

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  erkunden:
    runs-on: ubuntu-latest

    steps:
      - name: Begruessung
        run: echo "Hallo von GitHub Actions!"

      - name: Runner untersuchen
        run: |
          echo "Betriebssystem: $RUNNER_OS"
          echo "Repository: $GITHUB_REPOSITORY"
          pwd
          ls -la

      - name: Repository herunterladen
        uses: actions/checkout@v7

      - name: Repository-Inhalt untersuchen
        run: |
          echo "Aktuelles Verzeichnis:"
          pwd
          echo "Dateien im Verzeichnis:"
          ls -la
          echo "Inhalt der README:"
          cat README.md
          
      - name: Pull Request Informationen
        run: |
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Quellbranch: $GITHUB_HEAD_REF"
          echo "Zielbranch: $GITHUB_BASE_REF"
          echo "GitHub Ref: $GITHUB_REF"
          echo "GitHub SHA: $GITHUB_SHA"
          echo "Ausgecheckter Commit:"
          git log -1 --oneline

    vorbereitung:
    name: Vorbereitung
    runs-on: ubuntu-latest

    steps:
      - name: Start
        run: echo "Vorbereitung beginnt"

      - name: Simulierte Pruefung
        run: exit 0

      - name: Erfolgreiche Vorbereitung
        run: echo "Alles erfolgreich"

      - name: Abschlussmeldung
        if: ${{ always() }}
        run: echo "Vorbereitung beendet"

    tests:
      name: Tests
      needs: vorbereitung
      runs-on: ubuntu-latest
  
      steps:
        - name: Tests ausfuehren
          run: echo "Tests erfolgreich"
  
    bericht:
      name: Bericht
      needs: [vorbereitung, tests]
      if: ${{ always() }}
      runs-on: ubuntu-latest
  
      steps:
        - name: Ergebnisse anzeigen
          run: |
            echo "Vorbereitung: ${{ needs.vorbereitung.result }}"
            echo "Tests: ${{ needs.tests.result }}"
          

      - name: Pruefe wichtige Datei
        run: exit 0
